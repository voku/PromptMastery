      <path d="M 55 20 L 60 20 L 60 60 L 55 60 L 55 55 L 57 55 L 57 25 L 55 25 Z" />
      <rect x="32" y="32" width="16" height="4" rx="1" opacity="0.9"/>
      <rect x="34" y="40" width="12" height="4" rx="1" opacity="0.7"/>
      <rect x="36" y="48" width="8" height="4" rx="1" opacity="0.5"/>
    </g>
    <circle cx="54" cy="26" r="4" fill="#fbbf24"/>
  </g>
  
  <!-- Main title -->
  <text x="220" y="145" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="700" fill="#ffffff">
    PromptMastery
  </text>
  
  <!-- Subtitle -->
  <text x="220" y="200" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="400" fill="#e0f2fe">
