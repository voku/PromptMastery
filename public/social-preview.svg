  </text>
  
  <!-- Key features -->
  <g transform="translate(220, 270)">
    <g>
      <circle cx="8" cy="-4" r="6" fill="#0ea5e9"/>
      <text x="24" y="0" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="500" fill="#ffffff">
        30+ Production-Ready Patterns
      </text>
    </g>
    <g transform="translate(0, 60)">
      <circle cx="8" cy="-4" r="6" fill="#0ea5e9"/>
      <text x="24" y="0" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="500" fill="#ffffff">
        Interactive Learning Platform
      </text>
    </g>
    <g transform="translate(0, 120)">
      <circle cx="8" cy="-4" r="6" fill="#0ea5e9"/>
      <text x="24" y="0" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="500" fill="#ffffff">
        Agentic Architecture &amp; RAG Systems
      </text>
    </g>
  </g>
  
  <!-- Bottom tech stack hints -->
  <g transform="translate(220, 560)" opacity="0.7">
    <text font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="500" fill="#e0f2fe">
