<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <!-- Background gradient -->
  <rect width="1200" height="630" fill="#0c4a6e"/>
  <rect width="1200" height="630" fill="url(#grad1)"/>
  
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0c4a6e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0369a1;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Decorative code pattern (left side) -->
  <g opacity="0.15" fill="#ffffff">
    <rect x="40" y="80" width="200" height="8" rx="4"/>
    <rect x="40" y="110" width="160" height="8" rx="4"/>
    <rect x="40" y="140" width="180" height="8" rx="4"/>
    <rect x="40" y="200" width="220" height="8" rx="4"/>
    <rect x="40" y="230" width="140" height="8" rx="4"/>
    <rect x="40" y="260" width="190" height="8" rx="4"/>
    <rect x="40" y="320" width="180" height="8" rx="4"/>
    <rect x="40" y="350" width="200" height="8" rx="4"/>
    <rect x="40" y="380" width="150" height="8" rx="4"/>
    <rect x="40" y="440" width="210" height="8" rx="4"/>
    <rect x="40" y="470" width="170" height="8" rx="4"/>
    <rect x="40" y="500" width="190" height="8" rx="4"/>
  </g>
  
  <!-- Logo/Icon (top left) -->
  <g transform="translate(80, 80)">
    <circle cx="40" cy="40" r="38" fill="#0ea5e9"/>
    <!-- Prompt symbol -->
    <g fill="#ffffff">
